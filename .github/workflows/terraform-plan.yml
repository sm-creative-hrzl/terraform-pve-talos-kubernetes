name: terraform-plan

# Runs on pull requests to main OR manually on any branch via workflow_dispatch.
# Performs: format check, validate, and a speculative plan uploaded as artifact.
#
# NOTE: Talking to a homelab Proxmox/Talos network usually requires a
# self-hosted runner with network reachability. Swap `runs-on` accordingly.

on:
  pull_request:
    branches: [main]
    paths:
      - "**.tf"
      - "**.tftpl"
      - "manifests/**"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      var_file:
        description: "Var file to pass to terraform plan (e.g. input.tfvars)"
        required: false
        default: "input.tfvars"
        type: string

permissions:
  contents: read
  pull-requests: write

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_pve_api_url: ${{ secrets.PVE_API_URL }}
  TF_VAR_pve_token_id: ${{ secrets.PVE_TOKEN_ID }}
  TF_VAR_pve_token_secret: ${{ secrets.PVE_TOKEN_SECRET }}

jobs:
  plan:
    runs-on: [self-hosted]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Terraform
        run: |
          TF_VERSION="1.9.8"
          curl -fsSL "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip" -o /tmp/terraform.zip
          python3 -c "import zipfile; zipfile.ZipFile('/tmp/terraform.zip').extractall('/tmp/tf-bin')"
          mkdir -p "$HOME/.local/bin"
          mv /tmp/tf-bin/terraform "$HOME/.local/bin/terraform"
          chmod +x "$HOME/.local/bin/terraform"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          rm -rf /tmp/terraform.zip /tmp/tf-bin

      - name: Terraform fmt
        run: terraform fmt -recursive -check -diff

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        run: |
          VAR_FILE="${{ inputs.var_file }}"
          EXTRA_ARGS=""
          if [[ -n "${VAR_FILE}" && -f "${VAR_FILE}" ]]; then
            EXTRA_ARGS="-var-file=${VAR_FILE}"
          fi
          terraform plan -input=false -no-color -out=tfplan ${EXTRA_ARGS}
        continue-on-error: false

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.ref_name }}
          path: tfplan
          retention-days: 7
