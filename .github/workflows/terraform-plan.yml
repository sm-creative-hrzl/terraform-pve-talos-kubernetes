name: terraform-plan

# Manual-only. Run this workflow whenever you want a speculative plan.
#
# NOTE: Talking to a homelab Proxmox network usually requires a self-hosted
# runner with network reachability. Swap `runs-on` accordingly.

on:
    pull_request:
        branches: [main]
        paths:
            - "**.tf"
            - "**.tftpl"
            - "manifests/**"
            - ".github/workflows/**"
    workflow_dispatch:
        inputs:
            var_file:
                description: "Var file to pass to terraform plan (e.g. input.tfvars)"
                required: false
                default: "input.tfvars"
                type: string

permissions:
    contents: read
    pull-requests: write

# Credentials are sourced from organisation-level variables and secrets
# (sm-creative-hrzl organisation). No environment-level override is needed.
env:
    TF_IN_AUTOMATION: "true"
    TF_VERSION: ${{ vars.TF_VERSION }}
    TF_VAR_pve_api_url: ${{ vars.PVE_API_URL }}
    TF_VAR_pve_token_id: ${{ vars.PVE_TOKEN_ID }}
    TF_VAR_pve_token_secret: ${{ secrets.PVE_TOKEN_SECRET }}
    # MinIO backend credentials
    AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
    AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}

jobs:
    plan:
        runs-on: [self-hosted]
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Install Terraform
              run: |
                  TF_ZIP="terraform_${TF_VERSION}_linux_amd64.zip"
                  curl -fsSL -o "/tmp/${TF_ZIP}" \
                    "https://releases.hashicorp.com/terraform/${TF_VERSION}/${TF_ZIP}"
                  mkdir -p "${HOME}/.local/bin"
                  python3 -c "
                  import zipfile, sys
                  zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])
                  " "/tmp/${TF_ZIP}" "${HOME}/.local/bin"
                  chmod +x "${HOME}/.local/bin/terraform"
                  echo "${HOME}/.local/bin" >> "$GITHUB_PATH"

            - name: Terraform fmt
              run: terraform fmt -recursive -check -diff

            - name: Check backend credentials
              run: |
                  if [[ -z "${AWS_ACCESS_KEY_ID}" || -z "${AWS_SECRET_ACCESS_KEY}" ]]; then
                    echo "Missing MinIO backend credentials. Configure MINIO_ACCESS_KEY and MINIO_SECRET_KEY as organisation variables/secrets." >&2
                    exit 1
                  fi

            - name: Terraform init
              run: terraform init -input=false

            - name: Terraform validate
              run: terraform validate

            - name: Terraform plan
              run: |
                  # workflow_dispatch sets inputs.var_file; PR triggers do not, so fall
                  # back to input.tfvars which is committed and contains all required vars.
                  VAR_FILE="${{ inputs.var_file }}"
                  if [[ -z "${VAR_FILE}" ]]; then
                    VAR_FILE="input.tfvars"
                  fi
                  EXTRA_ARGS=""
                  if [[ -f "${VAR_FILE}" ]]; then
                    EXTRA_ARGS="-var-file=${VAR_FILE}"
                  fi
                  terraform plan -input=false -out=tfplan ${EXTRA_ARGS}
              continue-on-error: false

            - name: Upload plan artifact
              uses: actions/upload-artifact@v7
              with:
                  # Use run_id, not ref_name: PR refs ("1/merge") and slashed branch
                  # names ("feature/foo") contain "/", which artifact names forbid.
                  name: tfplan-${{ github.run_id }}
                  path: tfplan
                  retention-days: 7
