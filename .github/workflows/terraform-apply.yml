name: terraform-apply

# Applies on every push to main (GitOps). Secrets are injected as TF_VAR_*.
#
# NOTE: This must run on a runner that can reach the Proxmox API and the Talos
# node network — almost always a self-hosted runner in the homelab.

on:
  push:
    branches: [main]
    paths:
      - "**.tf"
      - "**.tftpl"
      - "manifests/**"

# Prevent overlapping applies from racing on the same state.
concurrency:
  group: terraform-apply
  cancel-in-progress: false

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_pve_api_url: ${{ vars.PVE_API_URL }}
  TF_VAR_pve_token_id: ${{ vars.PVE_TOKEN_ID }}
  TF_VAR_pve_token_secret: ${{ secrets.PVE_TOKEN_SECRET }}
  # MinIO backend credentials
  AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}

jobs:
  apply:
    runs-on: [self-hosted] # needs reachability to Proxmox + node network
    environment: homelab # provides MinIO + Proxmox secrets/vars; add reviewers for an approval gate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Terraform
        run: |
          TF_VERSION="1.9.8"
          curl -fsSL "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip" -o /tmp/terraform.zip
          python3 -c "import zipfile; zipfile.ZipFile('/tmp/terraform.zip').extractall('/tmp/tf-bin')"
          mkdir -p "$HOME/.local/bin"
          mv /tmp/tf-bin/terraform "$HOME/.local/bin/terraform"
          chmod +x "$HOME/.local/bin/terraform"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          rm -rf /tmp/terraform.zip /tmp/tf-bin

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve -no-color -var-file=input.tfvars

      # NOTE: the kubeconfig is intentionally NOT uploaded as an artifact —
      # that would expose cluster-admin credentials to anyone with Actions
      # access. Retrieve it on demand from a trusted host with:
      #   terraform output -raw kubeconfig > kubeconfig   (or scripts/kubeconfig.sh)
